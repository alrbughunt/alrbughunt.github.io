
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebKit Geolocation Origin Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            max-width: 760px;
            margin: 30px auto;
            padding: 16px;
            color: #172033;
            background: #f4f6fa;
        }
        section {
            padding: 18px;
            margin: 16px 0;
            background: white;
            border: 1px solid #dce2eb;
            border-radius: 10px;
        }
        button {
            padding: 12px 16px;
            background: #245bd6;
            color: white;
            border: 0;
            border-radius: 7px;
            font-size: 15px;
        }
        pre {
            padding: 12px;
            color: #d1fae5;
            background: #111827;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>WebKit Geolocation Origin Test</h1>

    <section>
        <h2>Requesting document</h2>
        <pre id="environment"></pre>
        <button id="startButton">Start controlled test</button>
    </section>

    <section>
        <h2>Test log</h2>
        <pre id="log">Ready.</pre>
    </section>

    <script>
        "use strict";

        const logElement = document.getElementById("log");

        document.getElementById("environment").textContent = [
            "Origin: " + location.origin,
            "Hostname: " + location.hostname,
            "Secure context: " + window.isSecureContext,
            "User agent: " + navigator.userAgent,
            "Timestamp: " + new Date().toISOString()
        ].join("\n");

        function report(message) {
            const entry =
                "[" + new Date().toISOString() + "] " + message;

            logElement.textContent += entry + "\n";

            // Send diagnostics only to the local test application.
            try {
                const handler =
                    window.webkit &&
                    window.webkit.messageHandlers &&
                    window.webkit.messageHandlers.report;

                if (handler) {
                    handler.postMessage(entry);
                }
            } catch (_) {}
        }

        window.requestLocationForTest = function () {
            report("Geolocation request initiated.");
            report("Document origin: " + location.origin);

            if (!navigator.geolocation) {
                report("ERROR: Geolocation API unavailable.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    report("CALLBACK: SUCCESS");
                    report("Latitude: " +
                        position.coords.latitude);
                    report("Longitude: " +
                        position.coords.longitude);
                    report("Accuracy: " +
                        position.coords.accuracy + " meters");
                    report("Position timestamp: " +
                        new Date(position.timestamp).toISOString());
                },
                function (error) {
                    report("CALLBACK: ERROR");
                    report("Error code: " + error.code);
                    report("Error message: " + error.message);
                },
                {
                    enableHighAccuracy: false,
                    timeout: 20000,
                    maximumAge: 0
                }
            );
        };

        document.getElementById("startButton")
            .addEventListener("click", function () {
                const handler =
                    window.webkit &&
                    window.webkit.messageHandlers &&
                    window.webkit.messageHandlers.startRace;

                if (!handler) {
                    report(
                        "This page is not running in the native " +
                        "WKWebView test harness. A normal Safari " +
                        "page cannot reliably synchronize with " +
                        "the native provisional-navigation callback."
                    );
                    return;
                }

                report("Controlled navigation test requested.");
                handler.postMessage("start");
            });
    </script>
</body>
</html>
