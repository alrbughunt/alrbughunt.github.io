<!DOCTYPE html>
<html>
<body>

<h2>Multiple Download Test</h2>

<script>

for(let i=0;i<100;i++){

setTimeout(()=>{

let a=document.createElement("a");

a.href=
"data:text/plain,Download-Test-"+i;

a.download=
"test-"+i+".txt";

document.body.appendChild(a);

a.click();

a.remove();

}, i*500);

}

</script>

</body>
</html>
